AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Melodia backend (Faz 2) - kullanıcı kotasını kontrol edip Suno API'ye
  istek yönlendiren güvenli proxy. Artık üretilen şarkı dosyaları Suno'nun
  geçici sunucusunda bırakılmıyor; kaydedilirken kendi S3 bucket'ımıza
  kopyalanıp CloudFront üzerinden, imzalı URL ile sunuluyor.

Parameters:
  AppleBundleId:
    Type: String
    Default: "com.mertyener.melodia"
  CloudFrontPublicKeyPem:
    Type: String
    Description: Audio dağıtımı için RSA public key PEM içeriği.
  CloudFrontPrivateKeySecretArn:
    Type: String
    Description: Private key'i içeren Secrets Manager secret ARN'i.
  AppleIapIssuerId:
    Type: String
    Default: "b5d98ed6-db6c-45fa-b55c-99cd1c8f61df"
    Description: >
      App Store Connect > Users and Access > Integrations > In-App
      Purchase'dan alınan Issuer ID.
  AppleIapKeyId:
    Type: String
    Default: "25V68W394G"
    Description: >
      Aynı yerden oluşturulan In-App Purchase API anahtarının Key ID'si.
  AppleIapEnvironment:
    Type: String
    Default: "Sandbox"
    AllowedValues: ["Sandbox", "Production"]
    Description: >
      TestFlight/sandbox test ederken "Sandbox", App Store'da canlıya
      alınca "Production" yapıp sadece "sam deploy" ile değiştirilir.
  AppleAppAppleId:
    Type: String
    Default: ""
    Description: >
      App Store Connect > App Information > Apple ID (sayısal). SADECE
      Production ortamında zorunlu, Sandbox'ta boş bırakılabilir.
  # ---------------------------------------------------------------
  # YENİDEN EKLENDİ (cross-stack export/import koruması): Bu 5
  # parametre + aşağıdaki CreditUsageTable/IdempotencyTable kaynakları
  # ve ilgili Export'lar, ÖNCEKİ bir "final production hardening"
  # turunda template.yaml'dan YANLIŞLIKLA çıkarılmıştı (GitHub'a hiç
  # push edilmemiş bir versiyon baz alınmıştı). Canlıda deploy edilmiş
  # gerçek Lambda kod paketleri (melodia-video: creditLedger.js,
  # melodia-music-spec: credit_ledger.py/credit_plans.py) BU
  # DEĞERLERE VE TABLOLARA AKTİF OLARAK BAĞIMLI olduğu, hem
  # `aws cloudformation list-imports` hem doğrudan indirilen ZIP kod
  # paketleri incelenerek KESİN olarak doğrulandı. Bu blok, o
  # bağımlılıkları geri kurup korumak için eklendi -- backend'in KENDİ
  # kodu bu değerleri kullanmıyor, sadece cross-stack sözleşmeyi
  # (Export) sağlıyor.
  MusicSpecCreditCost:
    Type: Number
    Default: 0
    Description: >
      Bir music-spec (AI muzik parametre) cikarimi kac jeton harcasin?
      TEK GERCEK KAYNAK burasi -- melodia-music-spec kendi parametresini
      TUTMUYOR, bu degeri ImportValue ile buradan okuyor.
  PlanCreditsFree:
    Type: Number
    Default: 1
    Description: >
      Free (abonesiz) kullanicinin YASAM BOYU (bir kez, hic sifirlanmayan)
      toplam jeton hakki.
  PlanCreditsWeekly:
    Type: Number
    Default: 25
    Description: pro_weekly plani -- HAFTALIK sifirlanan jeton hakki.
  PlanCreditsMonthly:
    Type: Number
    Default: 120
    Description: pro_monthly plani -- AYLIK sifirlanan jeton hakki.
  PlanCreditsYearly:
    Type: Number
    Default: 120
    Description: >
      pro_yearly plani -- pro_monthly ile AYNI aylik jeton hakki (yillik
      odeme sadece faturalama sikligini degistiriyor).

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: nodejs24.x
    Environment:
      Variables:
        TABLE_NAME: !Ref UsersTable
        SUNO_API_KEY: '{{resolve:secretsmanager:melodia/suno-api-key}}'
        GEMINI_API_KEY: '{{resolve:secretsmanager:melodia/gemini-api-key}}'
        # YENİ (FINAL PRODUCTION HARDENING — madde 6, webhook authentication):
        # sunoapi.org HMAC/imza tabanlı bir webhook doğrulama SUNMUYOR --
        # bu paylaşılan secret'ı BİZ üretip callBackUrl'e (generate.js)
        # gömüyoruz, sunoCallback.js de aynı değeri doğruluyor. SUNO_API_KEY
        # ile AYNI desen: deploy anında Secrets Manager'dan çözülür, koda
        # asla açık yazılmaz. DEPLOY ÖNCESİ bu secret'ı oluşturman gerekir:
        #   aws secretsmanager create-secret --name melodia/suno-callback-secret \
        #     --secret-string "$(openssl rand -hex 32)"
        # (openssl rand -hex 32 -> 256 bit/64 hex karakter rastgele değer)
        SUNO_CALLBACK_SECRET: '{{resolve:secretsmanager:melodia/suno-callback-secret}}'
        SONGS_TABLE_NAME: !Ref SongsTable
        AUDIO_BUCKET_NAME: !Ref AudioBucket
        CLOUDFRONT_DOMAIN: !GetAtt AudioDistribution.DomainName
        CLOUDFRONT_KEY_PAIR_ID: !GetAtt AudioPublicKey.Id
        CLOUDFRONT_PRIVATE_KEY_SECRET_ARN: !Ref CloudFrontPrivateKeySecretArn

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: melodia-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # YENİ (jeton istismarı düzeltmesi): "hesabı sil, aynı Apple kimliğiyle
  # tekrar kaydol, yeniden ücretsiz jeton kazan" döngüsünü kapatmak için.
  # appleAuth.js, Apple'ın bu uygulama+Apple ID kombinasyonu için verdiği
  # SABİT kimliği (hesap silinse bile DEĞİŞMEYEN) hash'leyip buraya
  # KALICI olarak yazıyor -- deleteAccount.js bu tabloyu BİLEREK
  # SİLMİYOR/silmemeli (bkz. deleteAccount.js'teki not). Tabloda isim,
  # e-posta ya da başka bir kişisel veri YOK -- sadece opak bir hash +
  # zaman damgası, TEK amacı bu kötüye kullanımı önlemek. TTL YOK --
  # kalıcı olması gerekiyor.
  FreeTrialLedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: melodia-free-trial-ledger
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: appleUserIdHash
          AttributeType: S
      KeySchema:
        - AttributeName: appleUserIdHash
          KeyType: HASH

  # Suno'nun her sarki uretiminde GERCEKTE kac kredi harcadigini olcmek
  # icin gecici bir kayit tablosu. generate.js istek atmadan ONCE bakiyeyi
  # buraya yazar, sunoCallback.js sarki bitince bakiyeyi tekrar olcup
  # farki hesaplar ve CloudWatch loglarina yazar. Test asamasinda (tek
  # kullanici) bu fark kesin dogrudur. TTL ile 7 gun sonra otomatik silinir.
  GenerationCostLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: melodia-generation-cost-log
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: taskId
          AttributeType: S
      KeySchema:
        - AttributeName: taskId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # YENİ: Şarkı üretim işlerinin (job) durumunu tutan tablo. generate.js
  # Suno'ya artık DOĞRUDAN istek atmıyor — burada "queued" bir kayıt
  # oluşturup ilgili kuyruğa (Suno ya da Lyria) yazıyor.
  # processSunoGeneration.js / processLyriaGeneration.js (worker'lar) bu
  # kaydı okuyup Suno/Lyria'yı çağırıyor ve sonucu (ready/failed +
  # taskId) buraya yazıyor. Flutter istemcisi /status?jobId=... ile bu
  # tabloyu pollar. TTL ile 24 saat sonra otomatik silinir.
  GenerationJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: melodia-generation-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
        # YENİ (5.000 kullanıcı ölçeklendirmesi — webhook + 18sn cache):
        # sunoCallback.js, Suno'nun webhook'unda SADECE taskId'yi bilir
        # (jobId'yi DEĞİL) -- bu GSI olmadan doğru job kaydını bulmak
        # için tüm tabloyu taramak (Scan) gerekirdi, bu da 5.000
        # kullanıcı ölçeğinde hem yavaş hem pahalı olurdu.
        - AttributeName: taskId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TaskIdIndex
          KeySchema:
            - AttributeName: taskId
              KeyType: HASH
          # KEYS_ONLY yeterli: sunoCallback.js bu sorgudan SADECE jobId'yi
          # okuyor (bkz. sunoStatusCache.js -> findJobByTaskId), tüm job
          # kaydını GSI'a kopyalamanın (ProjectionType ALL) ek depolama/
          # yazma maliyeti gereksiz.
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # YENİDEN EKLENDİ: melodia-video (createVideoProject.js/generateStoryboard.js
  # -> creditLedger.js) ve melodia-music-spec (app.py -> credit_ledger.py)
  # tarafından cross-stack ImportValue ile kullanılan PAYLAŞILAN jeton
  # kullanım sayacı. Bu tablo (userId+period) bazında "bu dönem ne kadar
  # jeton kullanıldı" tutuyor -- backend/video/music-spec'in HEPSİ aynı
  # (user, dönem) satırına atomik ADD ile yazabiliyor. Bkz. Parameters
  # bölümündeki not -- bu tablo daha önce yanlışlıkla kaldırılmıştı.
  CreditUsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: melodia-credit-usage
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: period
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: period
          KeyType: RANGE

  # YENİDEN EKLENDİ: melodia-music-spec'in credit_ledger.py'sindeki
  # charge_credits() fonksiyonu, aynı (userId, action, requestId) ile
  # gelen tekrar çağrıların jetonu iki kez düşürmesini bu tablo
  # üzerindeki koşullu put_item ile engelliyor. Bkz. Parameters
  # bölümündeki not.
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: melodia-idempotency
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotencyKey
          AttributeType: S
      KeySchema:
        - AttributeName: idempotencyKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ---------------------------------------------------------------
  # DEĞİŞTİ (FINAL PRODUCTION HARDENING — madde 8): Suno ve Lyria artık
  # AYRI kuyruk + AYRI worker (processSunoGeneration.js /
  # processLyriaGeneration.js). Önceden ikisi AYNI kuyruğu/fonksiyonu
  # paylaşıyordu; Lyria job'ları senkron olarak Lambda'yı ~150sn açık
  # tuttuğu için, yoğun Lyria kullanımı Suno'nun hızlı submission
  # akışının concurrency slotlarını tüketebiliyordu. Artık bu imkansız.
  # ---------------------------------------------------------------
  MusicGenerationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: melodia-music-generation-dlq
      MessageRetentionPeriod: 1209600 # 14 gün

  MusicGenerationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: melodia-music-generation-queue
      VisibilityTimeout: 60 # DEĞİŞTİ: Suno submission'ı artık hızlı (Lyria'nın 150sn'lik bekleme süresini TAŞIMIYOR, o LyriaGenerationQueue'da) -- ProcessSunoGenerationFunction'ın yeni Timeout'undan (30sn) biraz fazla.
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MusicGenerationDLQ.Arn
        maxReceiveCount: 3

  LyriaGenerationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: melodia-lyria-generation-dlq
      MessageRetentionPeriod: 1209600 # 14 gün

  LyriaGenerationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: melodia-lyria-generation-queue
      VisibilityTimeout: 180 # Lyria tam şarkı üretimini SENKRON bekliyor (ProcessLyriaGenerationFunction Timeout: 150sn) + pay.
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt LyriaGenerationDLQ.Arn
        maxReceiveCount: 3

  # YENİ (madde 10 — observability): tüm kritik alarmların (DLQ derinliği,
  # Lambda hataları, stale-claim, provider rate-limit tükenmesi) gittiği
  # tek SNS topic'i. Deploy sonrası AWS Konsolu'ndan (SNS > Topics >
  # MelodiaAlarms > Create subscription) bir e-posta/Slack webhook
  # abone etmen gerekir -- bu, senin karar vereceğin bir bilgi (e-posta
  # adresi) olduğu için template'e gömülmedi.
  MelodiaAlarmsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: melodia-alarms
      DisplayName: Melodia Production Alarms


  # YENİ: Kullanıcı bazlı hız sınırlama (rate limiting) için sayaç tablosu.
  # rateLimit.js bu tabloyu "sabit pencereli" bir sayaç olarak kullanıyor —
  # her (kullanıcı, uç nokta, zaman dilimi) için atomik bir sayaç tutuluyor.
  # TTL ile pencere kapanınca otomatik silinir, elle temizlik gerekmez.
  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: melodia-rate-limits
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rateLimitKey
          AttributeType: S
      KeySchema:
        - AttributeName: rateLimitKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  SongsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: melodia-songs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: songId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: songId
          KeyType: RANGE

  # ---------------------------------------------------------------
  # YENİ: Şarkı ses dosyaları için kalıcı, private depolama
  # ---------------------------------------------------------------
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub melodia-audio-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AudioBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AudioBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              - !Sub "${AudioBucket.Arn}/songs/*"
              - !Sub "${AudioBucket.Arn}/avatars/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${AudioDistribution}"

  AudioOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: melodia-audio-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AudioPublicKey:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        Name: melodia-audio-key
        EncodedKey: !Ref CloudFrontPublicKeyPem
        CallerReference: melodia-audio-key-v1

  AudioKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Name: melodia-audio-key-group
        Items:
          - !Ref AudioPublicKey

  AudioDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultCacheBehavior:
          TargetOriginId: AudioS3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS Managed-CachingOptimized
          TrustedKeyGroups:
            - !Ref AudioKeyGroup
        Origins:
          - Id: AudioS3Origin
            DomainName: !GetAtt AudioBucket.RegionalDomainName
            OriginAccessControlId: !Ref AudioOAC
            S3OriginConfig:
              OriginAccessIdentity: ""

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: melodia-users-pool
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      # YENİ (jeton istismarı düzeltmesi — e-posta/şifre boşluğu): bkz.
      # postConfirmation.js. E-posta/şifre ile kayıt appleAuth.js'e HİÇ
      # uğramadığı için (Flutter -> doğrudan Cognito HTTP API), bu
      # tetikleyici olmadan o yol için free-trial-abuse koruması ASLA
      # devreye giremiyordu.
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: melodia-mobile-app
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH

  # YENİ (jeton istismarı düzeltmesi — e-posta/şifre boşluğu): bkz.
  # postConfirmation.js üstündeki uzun açıklama. Cognito'nun kendisi
  # tarafından, e-posta onayı (ConfirmSignUp) başarılı olduğunda
  # OTOMATİK ve ATLANAMAZ şekilde çağrılır -- SAM'in Api event'lerinin
  # aksine, Cognito trigger'ları için çağırma izni SAM otomatik
  # oluşturmuyor, bu yüzden aşağıdaki PostConfirmationFunctionCognitoPermission
  # elle ekleniyor.
  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: postConfirmation.handler
      Environment:
        Variables:
          FREE_TRIAL_LEDGER_TABLE_NAME: !Ref FreeTrialLedgerTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt UsersTable.Arn

  PostConfirmationFunctionCognitoPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PostConfirmationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # DEĞİŞTİ: Artık Suno'yu doğrudan çağırmıyor — sadece kredi rezervasyonu
  # yapıp bir job kaydı oluşturuyor ve provider'a göre doğru kuyruğa

  # (Suno ya da Lyria) yazıyor. Bu yüzden Timeout kısaltıldı (ağır iş
  # artık burada değil).
  GenerateSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: generate.handler
      Timeout: 15
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref GenerationJobsTable
          GENERATION_QUEUE_URL: !Ref MusicGenerationQueue
          # YENİ (madde 8): provider'a göre doğru kuyruğa yönlendirme.
          LYRIA_GENERATION_QUEUE_URL: !Ref LyriaGenerationQueue
          RATE_LIMIT_TABLE_NAME: !Ref RateLimitTable
          # YENİ (jeton istismarı düzeltmesi): bkz. creditReservation.js
          FREE_TRIAL_LEDGER_TABLE_NAME: !Ref FreeTrialLedgerTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GenerationJobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
        # YENİ (jeton istismarı düzeltmesi): claimFreeTrialOrThrow SADECE
        # PutItem yapıyor (DynamoDBCrudPolicy yerine dar/minimal bir izin
        # yeterli -- bu fonksiyonun bu tablodan HİÇBİR ŞEYİ okumasına/
        # silmesine gerek yok).
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt FreeTrialLedgerTable.Arn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MusicGenerationQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt LyriaGenerationQueue.QueueName
        # YENİ (Remix): kaynak şarkıyı kullanıcının kendi kütüphanesinden
        # okumak için (sadece GetItem).
        - DynamoDBReadPolicy:
            TableName: !Ref SongsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /generate
            Method: post

  # DEĞİŞTİ (FINAL PRODUCTION HARDENING — madde 8): eski
  # ProcessMusicGenerationFunction ikiye ayrıldı. Bu, SADECE Suno
  # submission'larını işler (processSunoGeneration.js) -- MusicGenerationQueue'dan
  # tetiklenir. Suno geçici hata verirse (5xx/429/timeout) istisna
  # fırlatılır ve SQS otomatik yeniden dener; kalıcı hatalarda job
  # "failed" işaretlenir ve rezerve edilen kredi İADE EDİLİR (bkz.
  # jobLifecycle.js -> markFailed -> creditReservation.refundCredits).
  #
  # DEĞİŞTİ (madde 1): kredi ARTIK BURADA DÜŞÜLMÜYOR -- generate.js'de
  # job kuyruğa yazılmadan ÖNCE atomik olarak rezerve edildi.
  ProcessSunoGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: processSunoGeneration.handler
      # DEĞİŞTİ: Suno submission'ı artık hızlı (webhook ile sonuçlanıyor,
      # burada sonucu BEKLEMİYORUZ) -- 150sn'den 30sn'ye indirildi.
      Timeout: 30
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref GenerationJobsTable
          RATE_LIMIT_TABLE_NAME: !Ref RateLimitTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GenerationJobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
        # YENİ (madde 1 — atomik kredi iadesi): jobLifecycle.markFailed,
        # kredi iadesini VE job üzerindeki "refunded" bayrağını TEK
        # DynamoDB Transaction'ında (TransactWriteItems) yazıyor.
        # DynamoDBCrudPolicy bu işlemi İÇERMEZ, ayrıca ekleniyor.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt UsersTable.Arn
                - !GetAtt GenerationJobsTable.Arn
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/suno-api-key-*'
        # YENİ (Remix): kaynak şarkı için CloudFront imzalı URL üretip
        # Suno'nun upload-cover'ına vermek üzere (bkz. cloudfrontSigner.js).
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref CloudFrontPrivateKeySecretArn
      Events:
        GenerationQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt MusicGenerationQueue.Arn
            BatchSize: 1
            # YENİ (madde 4/8 — Lambda concurrency ≠ Suno concurrency):
            # Suno'nun GERÇEK hız sınırı sunoProxy.js'teki DynamoDB
            # tabanlı sayaçla KESİN olarak korunuyor -- buradaki 10,
            # sadece kuyruk aniden binlerce mesajla dolduğunda binlerce
            # Lambda'nın anlık olarak ayağa kalkmasını önleyen kaba bir
            # üst sınır. Artık Lyria ile PAYLAŞILMIYOR.
            ScalingConfig:
              MaximumConcurrency: 10

  # YENİ (madde 8): Lyria'ya ÖZGÜ worker -- LyriaGenerationQueue'dan
  # tetiklenir, senkron olarak tam şarkı üretimini bekler (Timeout: 150sn).
  # Suno worker'ından TAMAMEN bağımsız concurrency'e sahip -- biri
  # diğerinin slotlarını tüketemez.
  ProcessLyriaGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: processLyriaGeneration.handler
      Timeout: 150
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref GenerationJobsTable
          AUDIO_BUCKET_NAME: !Ref AudioBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GenerationJobsTable
        - S3CrudPolicy:
            BucketName: !Ref AudioBucket
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt UsersTable.Arn
                - !GetAtt GenerationJobsTable.Arn
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/gemini-api-key-*'
      Events:
        LyriaGenerationQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt LyriaGenerationQueue.Arn
            BatchSize: 1
            # Lyria job'ları uzun sürdüğü (150sn'e kadar) için daha
            # yüksek bir üst sınır -- Gemini'nin kendi hız sınırı resmi
            # API olduğu için Suno'dan daha yüksek/farklı, bu worker
            # sunoProxy.js'in limiter'ını hiç kullanmıyor (lyriaProxy.js
            # ayrı, kendi HTTP timeout'una sahip).
            ScalingConfig:
              MaximumConcurrency: 20

  LyricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: lyrics.handler
      Environment:
        Variables:
          RATE_LIMIT_TABLE_NAME: !Ref RateLimitTable
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/suno-api-key-*'
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /lyrics
            Method: post

  LyricsStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: lyricsStatus.handler
      Environment:
        Variables:
          RATE_LIMIT_TABLE_NAME: !Ref RateLimitTable
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/suno-api-key-*'
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /lyrics-status
            Method: get

  # DEĞİŞTİ: Artık jobId (queued/submitting/failed/ready) VEYA taskId
  # (Suno'nun kendi durumu) ile sorgulanabiliyor. GenerationJobsTable
  # okuma izni ve tablo adı eklendi.
  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: status.handler
      # DÜZELTME (deploy hatası): ReservedConcurrentExecutions: 200
      # ayarı KALDIRILDI -- bu hesabın GERÇEK toplam Lambda concurrency
      # kotası sadece 10 (AWS'nin yeni-hesap varsayılanı, henüz
      # artırılmamış), 1000 DEĞİL. "200 ayır" isteği, deploy'u
      # "ReservedConcurrentExecutions ... decreases account's
      # UnreservedConcurrentExecutions below its minimum value of [10]"
      # hatasıyla başarısız kılıp otomatik rollback'e düşürdü. 10'luk
      # bir kotada StatusFunction'a herhangi bir pay ayırmak (5 bile)
      # geri kalan ~17 fonksiyonun paylaşacağı alanı tehlikeli şekilde
      # daraltır. GERÇEK 5.000 kullanıcı hedefine yaklaşmadan önce,
      # AWS Support üzerinden bu hesabın "Concurrent executions"
      # kotasının (Service Quotas kod: L-B99A9384) artırılması
      # ŞART -- bu bir kod/config değişikliği değil, hesap kotası
      # talebidir. Kota artınca bu satır (uygun bir değerle, örn. yeni
      # kotanın ~%20'si) geri eklenebilir.
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref GenerationJobsTable
          RATE_LIMIT_TABLE_NAME: !Ref RateLimitTable
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/suno-api-key-*'
        # DEĞİŞTİ: DynamoDBReadPolicy -> DynamoDBCrudPolicy. status.js
        # artık sadece OKUMUYOR -- 18sn'lik cache bayatladığında yaptığı
        # güvenlik-ağı poll'unun sonucunu da job kaydına YAZIYOR (bkz.
        # fallbackLivePoll -> writeSunoStatusCache), böylece aynı job'ı
        # o an pollayan başka istekler de bu tek canlı çağrıdan
        # faydalanabiliyor.
        - DynamoDBCrudPolicy:
            TableName: !Ref GenerationJobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /status
            Method: get

  # DEĞİŞTİ (5.000 kullanıcı ölçeklendirmesi): artık sadece loglamıyor --
  # Suno'nun webhook sonucunu GenerationJobsTable'a yazıyor (bkz.
  # sunoCallback.js, sunoStatusCache.js). Bu yüzden tabloya okuma+yazma
  # (TaskIdIndex GSI'ı üzerinden sorgu + UpdateItem) izni ve tablo adı
  # gerekiyor.
  SunoCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: sunoCallback.handler
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref GenerationJobsTable
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/suno-api-key-*'
        - DynamoDBCrudPolicy:
            TableName: !Ref GenerationJobsTable
        # YENİ (madde 1/6 — webhook'un async "error" dalındaki kredi
        # iadesi): refundCredits, iade VE job'ın "refunded" bayrağını
        # TEK DynamoDB Transaction'ında yazıyor.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt UsersTable.Arn
                - !GetAtt GenerationJobsTable.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /suno-callback
            Method: post
            Auth:
              Authorizer: NONE

  AppleAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: appleAuth.handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          APPLE_BUNDLE_ID: !Ref AppleBundleId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
        # YENİ (jeton istismarı düzeltmesi): appleUserIdHash'i UsersTable'a
        # yazabilmek için -- SADECE UpdateItem, dar/minimal izin.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt UsersTable.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /auth/apple
            Method: post
            Auth:
              Authorizer: NONE

  GetQuotaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: quota.handler
      # YENİ (jeton istismarı düzeltmesi — /quota'nın yanlış "1 jeton
      # var" göstermesi): bkz. quota.js üstündeki açıklama.
      Environment:
        Variables:
          FREE_TRIAL_LEDGER_TABLE_NAME: !Ref FreeTrialLedgerTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref FreeTrialLedgerTable
        # YENİ: avatarUrl imzalamak için (bkz. quota.js -> cloudfrontSigner.js)
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref CloudFrontPrivateKeySecretArn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /quota
            Method: get

  # YENİ (Complete Your Profile akışı): profilin bir bölümünü kısmi
  # olarak günceller (isim/avatar/tür/mood/hedef + adım numarası).
  UpdateProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: updateProfile.handler
      Timeout: 15
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /profile
            Method: post

  # YENİ (avatar yükleme): S3'e DOĞRUDAN yükleme için presigned PUT URL
  # üretir -- audioStorage.js'deki getPresignedAudioUrl (GET) ile AYNI
  # desen, ters yönde.
  AvatarUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: avatarUploadUrl.handler
      Timeout: 15
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref AudioBucket
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /profile/avatar-upload-url
            Method: post

  LyricsTimestampsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: lyricsTimestamps.handler
      Environment:
        Variables:
          RATE_LIMIT_TABLE_NAME: !Ref RateLimitTable
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/suno-api-key-*'
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /lyrics-timestamps
            Method: post

  # DEĞİŞTİ: artık Suno'dan gelen sesi indirip AudioBucket'a kopyalıyor,
  # bu yüzden S3 yazma izni ve daha uzun timeout gerekiyor.
  SaveSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: saveSong.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SongsTable
        - S3CrudPolicy:
            BucketName: !Ref AudioBucket
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /songs
            Method: post

  ListSongsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: listSongs.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SongsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /songs
            Method: get

  # YENİ: şarkı her çalınmak istendiğinde taze CloudFront signed URL üretir
  GetSongPlayUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: getSongPlayUrl.handler
      Timeout: 15
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SongsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref CloudFrontPrivateKeySecretArn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /songs/{songId}/play-url
            Method: get

  # YENİ: kullanıcı kütüphanesinden tek bir şarkıyı siler
  DeleteSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: deleteSong.handler
      Timeout: 15
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SongsTable
        - S3CrudPolicy:
            BucketName: !Ref AudioBucket
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /songs/{songId}
            Method: delete

  # YENİ (kütüphane favori kalıcılığı): favori durumunu HAFİF bir
  # UpdateItem ile kaydeder -- saveSong.js'in aksine ses dosyasını S3'e
  # yeniden kopyalamaz, bu yüzden ayrı bir fonksiyon.
  UpdateSongFavoriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: updateSongFavorite.handler
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SongsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /songs/{songId}
            Method: patch

  DeleteAccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: deleteAccount.handler
      Timeout: 30
      Environment:
        Variables:
          VIDEO_PROJECTS_TABLE_NAME: melodia-video-projects
          VIDEO_BUCKET_NAME: !Sub "melodia-video-${AWS::AccountId}-${AWS::Region}"
          USER_POOL_ID: !Ref UserPool
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SongsTable
        - S3CrudPolicy:
            BucketName: !Ref AudioBucket
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:DeleteItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/melodia-video-projects"
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::melodia-video-${AWS::AccountId}-${AWS::Region}/*"
            - Effect: Allow
              Action:
                - cognito-idp:AdminDeleteUser
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /account
            Method: delete

  # ---------------------------------------------------------------
  # YENİ (Madde 11 — Paywall): satın alma anında istemcinin gönderdiği
  # imzalı Apple makbuzunu doğrulayıp kullanıcının planını günceller.
  # Apple'ın RESMİ kütüphanesi (@apple/app-store-server-library)
  # kullanılıyor — imza doğrulama elle yazılmıyor.
  # ---------------------------------------------------------------
  VerifySubscriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: verifySubscription.handler
      Timeout: 20
      Environment:
        Variables:
          APPLE_BUNDLE_ID: !Ref AppleBundleId
          APPLE_IAP_ISSUER_ID: !Ref AppleIapIssuerId
          APPLE_IAP_KEY_ID: !Ref AppleIapKeyId
          APPLE_IAP_KEY_SECRET_ARN: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/apple-iap-private-key'
          APPLE_IAP_ENVIRONMENT: !Ref AppleIapEnvironment
          APPLE_APP_APPLE_ID: !Ref AppleAppAppleId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/apple-iap-private-key-*'
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /subscription/verify
            Method: post

  # YENİ (kredi paketleri): abonelik dışı, tek seferlik tüketilebilir
  # kredi paketi satın almalarını doğrular. verifySubscription.js ile
  # AYNI güvenlik deseni + IdempotencyTable üzerinden çift-kredi
  # eklenmesini engelleyen ek bir koruma (bkz. verifyCreditPurchase.js).
  VerifyCreditPurchaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: verifyCreditPurchase.handler
      Timeout: 20
      Environment:
        Variables:
          APPLE_BUNDLE_ID: !Ref AppleBundleId
          APPLE_IAP_ISSUER_ID: !Ref AppleIapIssuerId
          APPLE_IAP_KEY_ID: !Ref AppleIapKeyId
          APPLE_IAP_KEY_SECRET_ARN: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/apple-iap-private-key'
          APPLE_IAP_ENVIRONMENT: !Ref AppleIapEnvironment
          APPLE_APP_APPLE_ID: !Ref AppleAppAppleId
          IDEMPOTENCY_TABLE_NAME: !Ref IdempotencyTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/apple-iap-private-key-*'
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /credits/verify-purchase
            Method: post

  # YENİ (Madde 11): Apple'ın App Store Server Notifications V2 webhook'u.
  # Auth: NONE (Apple'ın sunucusu çağırıyor) ama güvenlik JWS imza
  # doğrulamasından geliyor.
  AppleNotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: appleNotifications.handler
      Timeout: 20
      Environment:
        Variables:
          APPLE_BUNDLE_ID: !Ref AppleBundleId
          APPLE_IAP_ISSUER_ID: !Ref AppleIapIssuerId
          APPLE_IAP_KEY_ID: !Ref AppleIapKeyId
          APPLE_IAP_KEY_SECRET_ARN: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/apple-iap-private-key'
          APPLE_IAP_ENVIRONMENT: !Ref AppleIapEnvironment
          APPLE_APP_APPLE_ID: !Ref AppleAppAppleId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/apple-iap-private-key-*'
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /apple-notifications
            Method: post
            Auth:
              Authorizer: NONE

  # GEÇİCİ — SADECE TEST: webhook kurulumunu doğruladıktan sonra bu
  # fonksiyonu ve requestTestNotification.js dosyasını silebilirsin.
  RequestTestNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: requestTestNotification.handler
      Timeout: 20
      Environment:
        Variables:
          APPLE_BUNDLE_ID: !Ref AppleBundleId
          APPLE_IAP_ISSUER_ID: !Ref AppleIapIssuerId
          APPLE_IAP_KEY_ID: !Ref AppleIapKeyId
          APPLE_IAP_KEY_SECRET_ARN: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/apple-iap-private-key'
          APPLE_IAP_ENVIRONMENT: !Ref AppleIapEnvironment
          APPLE_APP_APPLE_ID: !Ref AppleAppAppleId
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/apple-iap-private-key-*'
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /test-apple-notification
            Method: get
            Auth:
              Authorizer: NONE

  # DEĞİŞTİ (FINAL PRODUCTION HARDENING — madde 7): 5.000 kayıtlı
  # kullanıcı hedefi için 300/600'den 1500/3000'e çıkarıldı. Hesap:
  # 500-1.000 eşzamanlı aktif kullanıcı × 5sn'lik /status polling ≈
  # 100-200 istek/sn; buna diğer uç noktalar (/quota, /songs, /generate)
  # ve patlama payı eklenince 1500 sürdürülebilir / 3000 burst,
  # gerçekçi bir tepe yükün ÇOK üzerinde rahat bir pay bırakıyor.
  # AWS'nin bölge başına hesap-varsayılan API Gateway tavanı 10.000 RPS
  # sürdürülebilir / 5.000 burst (Service Quotas üzerinden artırılabilir)
  # -- yani bu değer, paylaşılan hesapta başka büyük yük yoksa, bir
  # AWS Support talebi GEREKTİRMEDEN mevcut varsayılan tavanın içinde
  # kalır. Trafik gerçek ölçümlerle netleşince (CloudWatch'taki
  # ApiGateway Count/Latency metrikleri) bu değer yine tek satırlık bir
  # değişiklikle ayarlanabilir.
  MelodiaApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 1500 # saniyede sürekli izin verilen ortalama istek sayısı (tüm API, tüm kullanıcılar toplamı)
          ThrottlingBurstLimit: 3000 # anlık patlamalarda (ör. binlerce kullanıcının aynı anda pollamaya başlaması) tolerans
      Cors:
        AllowMethods: "'GET,POST,DELETE,PATCH,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuth
        # DÜZELTME (tarayıcıda "ClientException: Failed to fetch"): SAM'in
        # bu ayarı VARSAYILAN olarak true'dur ve CognitoAuth'u, CORS için
        # otomatik üretilen OPTIONS (preflight) metotlarına DA ekler.
        # Tarayıcı preflight'ı Authorization başlığı OLMADAN gönderdiği
        # için her preflight 401 dönüyor, asıl istek hiç gönderilmiyordu --
        # yani Flutter Web'de /profile, /quota, /songs dahil TÜM backend
        # çağrıları kırıktı (mobilde CORS olmadığı için sorun görünmüyordu).
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn

  # ---------------------------------------------------------------
  # YENİ (FINAL PRODUCTION HARDENING — madde 10, observability):
  # DLQ derinliği, Lambda hataları, stale-claim ve provider rate-limit
  # tükenmesi için CloudWatch Alarm'ları -- hepsi MelodiaAlarmsTopic'e
  # (SNS) bildiriyor. Log Group'ları EXPLICIT olarak tanımlıyoruz (ilk
  # deploy'da Lambda henüz hiç çalışmadığı için otomatik oluşan log
  # group henüz yok -- MetricFilter var olmayan bir log group'a
  # bağlanamaz) + 30 günlük retention (varsayılan "hiç silinmez"
  # yerine, gereksiz log maliyeti birikmesin diye).
  # ---------------------------------------------------------------
  ProcessSunoGenerationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProcessSunoGenerationFunction}"
      RetentionInDays: 30

  ProcessLyriaGenerationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProcessLyriaGenerationFunction}"
      RetentionInDays: 30

  # madde 9 — stale-claim reclaim metriği (her iki worker'da da olabilir)
  ProcessSunoStaleClaimMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ProcessSunoGenerationLogGroup
      FilterPattern: "STALE_CLAIM_RECLAIMED"
      MetricTransformations:
        - MetricName: StaleClaimReclaimed
          MetricNamespace: Melodia
          MetricValue: "1"
          DefaultValue: 0

  ProcessLyriaStaleClaimMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ProcessLyriaGenerationLogGroup
      FilterPattern: "STALE_CLAIM_RECLAIMED"
      MetricTransformations:
        - MetricName: StaleClaimReclaimed
          MetricNamespace: Melodia
          MetricValue: "1"
          DefaultValue: 0

  StaleClaimReclaimedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: melodia-stale-claim-reclaimed
      AlarmDescription: >
        Bir job stale-claim ile yeniden ele alındı -- olası duplicate
        Suno/Lyria submission riski (madde 9). Suno/Lyria idempotency-key
        SUNMADIĞI için bu risk kod tarafında tam kapatılamıyor; sık
        tekrarlanıyorsa Suno/Gemini maliyet panelinden çapraz kontrol et.
      Namespace: Melodia
      MetricName: StaleClaimReclaimed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MelodiaAlarmsTopic

  # madde 5 — merkezi rate limiter'ın kendi bekleme bütçesini tükettiği
  # (Suno'ya hiç gidemediği) durumlar. Sık tekrarlanıyorsa
  # PROVIDER_WINDOW_LIMIT'in çok düşük olduğu ya da gerçek trafiğin
  # beklenenden çok yüksek olduğu anlamına gelir.
  ProviderRateLimitMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ProcessSunoGenerationLogGroup
      FilterPattern: "PROVIDER_RATE_LIMIT_EXHAUSTED"
      MetricTransformations:
        - MetricName: ProviderRateLimitExhausted
          MetricNamespace: Melodia
          MetricValue: "1"
          DefaultValue: 0

  StatusProviderRateLimitMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StatusFunction}"
      FilterPattern: "PROVIDER_RATE_LIMIT_EXHAUSTED"
      MetricTransformations:
        - MetricName: ProviderRateLimitExhausted
          MetricNamespace: Melodia
          MetricValue: "1"
          DefaultValue: 0

  ProviderRateLimitAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: melodia-provider-rate-limit-exhausted
      AlarmDescription: >
        Merkezi Suno rate limiter tekrar tekrar tükeniyor -- gerçek
        trafik PROVIDER_WINDOW_LIMIT'i (sunoProxy.js) aşıyor olabilir,
        ya da Suno hesabının kendi limitini yükseltmek gerekebilir.
      Namespace: Melodia
      MetricName: ProviderRateLimitExhausted
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MelodiaAlarmsTopic

  # madde 10 — DLQ derinliği. 0'dan büyük olması, 3 denemeden sonra
  # KALICI olarak başarısız kalmış (ve otomatik kurtarılamayan) işler
  # olduğu anlamına gelir -- manuel inceleme gerekir.
  MusicGenerationDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: melodia-suno-dlq-not-empty
      AlarmDescription: "MusicGenerationDLQ'da mesaj var -- 3 denemeden sonra kalıcı olarak başarısız Suno job'ları."
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt MusicGenerationDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MelodiaAlarmsTopic

  LyriaGenerationDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: melodia-lyria-dlq-not-empty
      AlarmDescription: "LyriaGenerationDLQ'da mesaj var -- 3 denemeden sonra kalıcı olarak başarısız Lyria job'ları."
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt LyriaGenerationDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MelodiaAlarmsTopic

  # madde 10 — Lambda hata oranı (worker'lar + status + generate).
  ProcessSunoGenerationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: melodia-process-suno-errors
      AlarmDescription: "ProcessSunoGenerationFunction'da hata oranı yüksek."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessSunoGenerationFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MelodiaAlarmsTopic

  ProcessLyriaGenerationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: melodia-process-lyria-errors
      AlarmDescription: "ProcessLyriaGenerationFunction'da hata oranı yüksek."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessLyriaGenerationFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MelodiaAlarmsTopic

  StatusFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: melodia-status-errors
      AlarmDescription: "StatusFunction'da (/status polling) hata oranı yüksek."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref StatusFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MelodiaAlarmsTopic

  GenerateSongFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: melodia-generate-errors
      AlarmDescription: "GenerateSongFunction'da (kredi rezervasyonu + job oluşturma) hata oranı yüksek."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GenerateSongFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MelodiaAlarmsTopic

  # madde 7 — DÜZELTME: ReservedConcurrentExecutions kaldırıldığı için
  # (hesabın toplam kotası sadece 10, bkz. StatusFunction'daki not) bu
  # alarm artık kendi payı değil, hesabın PAYLAŞILAN concurrency
  # havuzunun genel throttle'ını izliyor -- yine de erken uyarı için
  # değerli, dokunulmadı.
  StatusFunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: melodia-status-throttles
      AlarmDescription: >
        StatusFunction throttle yiyor -- hesabın PAYLAŞILAN Lambda
        concurrency kotası (şu an sadece 10, Service Quotas kod:
        L-B99A9384) yetersiz kalıyor olabilir. AWS Support üzerinden
        kota artışı gerekebilir.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref StatusFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MelodiaAlarmsTopic

Outputs:
  ApiUrl:
    Value: !Sub "https://${MelodiaApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  AudioBucketName:
    Value: !Ref AudioBucket
  AudioCloudFrontDomain:
    Value: !GetAtt AudioDistribution.DomainName
  UsersTableName:
    Description: >
      melodia-video ve melodia-music-spec stack'lerinin ayni jeton/kota
      havuzunu kontrol edebilmesi icin disari acilan tablo adi.
    Value: !Ref UsersTable
    Export:
      Name: melodia-users-table-name
  UsersTableArn:
    Value: !GetAtt UsersTable.Arn
    Export:
      Name: melodia-users-table-arn
  # YENİDEN EKLENDİ (bkz. Parameters bölümündeki not) -- bu 9 export,
  # melodia-video ve melodia-music-spec'in canlıda AKTİF olarak
  # ImportValue ile kullandığı, doğrulanmış cross-stack sözleşmenin
  # parçası. Kaldırılmaları/değiştirilmeleri o iki stack'in bir
  # sonraki deploy'unu VEYA runtime'ını kırar.
  CreditUsageTableName:
    Description: >
      melodia-video ve melodia-music-spec'in AYNI atomik jeton kullanim
      sayacini paylasmasi icin disari acilan tablo adi.
    Value: !Ref CreditUsageTable
    Export:
      Name: melodia-credit-usage-table-name
  CreditUsageTableArn:
    Value: !GetAtt CreditUsageTable.Arn
    Export:
      Name: melodia-credit-usage-table-arn
  IdempotencyTableName:
    Value: !Ref IdempotencyTable
    Export:
      Name: melodia-idempotency-table-name
  IdempotencyTableArn:
    Value: !GetAtt IdempotencyTable.Arn
    Export:
      Name: melodia-idempotency-table-arn
  MusicSpecCreditCostExport:
    Value: !Ref MusicSpecCreditCost
    Export:
      Name: melodia-music-spec-credit-cost
  PlanCreditsFreeExport:
    Value: !Ref PlanCreditsFree
    Export:
      Name: melodia-plan-credits-free
  PlanCreditsWeeklyExport:
    Value: !Ref PlanCreditsWeekly
    Export:
      Name: melodia-plan-credits-weekly
  PlanCreditsMonthlyExport:
    Value: !Ref PlanCreditsMonthly
    Export:
      Name: melodia-plan-credits-monthly
  PlanCreditsYearlyExport:
    Value: !Ref PlanCreditsYearly
    Export:
      Name: melodia-plan-credits-yearly
  MusicGenerationDLQUrl:
    Description: >
      Kalici olarak basarisiz olan (3 denemeden sonra) Suno muzik uretim
      isleri buraya duser. Boyutu 0'dan buyukse manuel inceleme gerekir.
    Value: !Ref MusicGenerationDLQ
  LyriaGenerationDLQUrl:
    Description: >
      Kalici olarak basarisiz olan (3 denemeden sonra) Lyria muzik
      uretim isleri buraya duser. Boyutu 0'dan buyukse manuel inceleme
      gerekir.
    Value: !Ref LyriaGenerationDLQ
  MelodiaAlarmsTopicArn:
    Description: >
      Deploy sonrasi SNS konsolundan (Topics > melodia-alarms >
      Create subscription) bir e-posta/Slack webhook abone et --
      butun kritik alarmlar (DLQ, Lambda hatalari, stale-claim,
      provider rate-limit tukenmesi) buraya bildiriyor.
    Value: !Ref MelodiaAlarmsTopic
  AppleNotificationsUrl:
    Description: >
      App Store Connect > App Information > App Store Server Notifications
      kismindaki "Sandbox Server URL" ve/veya "Production Server URL"
      alanina AYNEN bu degeri yapistir.
    Value: !Sub "https://${MelodiaApi}.execute-api.${AWS::Region}.amazonaws.com/prod/apple-notifications"