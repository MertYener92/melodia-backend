AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Melodia backend (Faz 2) - kullanıcı kotasını kontrol edip Suno API'ye
  istek yönlendiren güvenli proxy. Artık üretilen şarkı dosyaları Suno'nun
  geçici sunucusunda bırakılmıyor; kaydedilirken kendi S3 bucket'ımıza
  kopyalanıp CloudFront üzerinden, imzalı URL ile sunuluyor.

Parameters:
  AppleBundleId:
    Type: String
    Default: "com.melodia.app"
  SongCreditCost:
    Type: Number
    Default: 1
    Description: >
      TAHMINI DEGER. Bir sarki uretimi kac jeton harcasin? melodia-video ve
      melodia-music-spec ile AYNI birlesik jeton havuzundan dusuyor.
      Gercek maliyet netlesince bu degeri degistirip sadece "sam deploy"
      ile tekrar deploy et, koda dokunmana gerek yok.
  CloudFrontPublicKeyPem:
    Type: String
    Description: Audio dağıtımı için RSA public key PEM içeriği.
  CloudFrontPrivateKeySecretArn:
    Type: String
    Description: Private key'i içeren Secrets Manager secret ARN'i.
  AppleIapIssuerId:
    Type: String
    Default: "b5d98ed6-db6c-45fa-b55c-99cd1c8f61df"
    Description: >
      App Store Connect > Users and Access > Integrations > In-App
      Purchase'dan alınan Issuer ID.
  AppleIapKeyId:
    Type: String
    Default: "25V68W394G"
    Description: >
      Aynı yerden oluşturulan In-App Purchase API anahtarının Key ID'si.
  AppleIapEnvironment:
    Type: String
    Default: "Sandbox"
    AllowedValues: ["Sandbox", "Production"]
    Description: >
      TestFlight/sandbox test ederken "Sandbox", App Store'da canlıya
      alınca "Production" yapıp sadece "sam deploy" ile değiştirilir.
  AppleAppAppleId:
    Type: String
    Default: ""
    Description: >
      App Store Connect > App Information > Apple ID (sayısal). SADECE
      Production ortamında zorunlu, Sandbox'ta boş bırakılabilir.

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: nodejs20.x
    Environment:
      Variables:
        TABLE_NAME: !Ref UsersTable
        SUNO_API_KEY: '{{resolve:secretsmanager:melodia/suno-api-key}}'
        SONGS_TABLE_NAME: !Ref SongsTable
        AUDIO_BUCKET_NAME: !Ref AudioBucket
        CLOUDFRONT_DOMAIN: !GetAtt AudioDistribution.DomainName
        CLOUDFRONT_KEY_PAIR_ID: !GetAtt AudioPublicKey.Id
        CLOUDFRONT_PRIVATE_KEY_SECRET_ARN: !Ref CloudFrontPrivateKeySecretArn

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: melodia-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # Suno'nun her sarki uretiminde GERCEKTE kac kredi harcadigini olcmek
  # icin gecici bir kayit tablosu. generate.js istek atmadan ONCE bakiyeyi
  # buraya yazar, sunoCallback.js sarki bitince bakiyeyi tekrar olcup
  # farki hesaplar ve CloudWatch loglarina yazar. Test asamasinda (tek
  # kullanici) bu fark kesin dogrudur. TTL ile 7 gun sonra otomatik silinir.
  GenerationCostLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: melodia-generation-cost-log
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: taskId
          AttributeType: S
      KeySchema:
        - AttributeName: taskId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # YENİ: Şarkı üretim işlerinin (job) durumunu tutan tablo. generate.js
  # Suno'ya artık DOĞRUDAN istek atmıyor — burada "queued" bir kayıt
  # oluşturup MusicGenerationQueue'ya yazıyor. processMusicGeneration.js
  # (worker) bu kaydı okuyup Suno'yu çağırıyor ve sonucu (ready/failed +
  # taskId) buraya yazıyor. Flutter istemcisi /status?jobId=... ile bu
  # tabloyu pollar. TTL ile 24 saat sonra otomatik silinir.
  GenerationJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: melodia-generation-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ---------------------------------------------------------------
  # YENİ: Müzik üretim kuyruğu (SQS). generate.js artık Suno'yu
  # SENKRON çağırmıyor, sadece bu kuyruğa yazıyor. Böylece:
  #  - processMusicGeneration bir istisna fırlatırsa (Suno 5xx/429/
  #    timeout gibi geçici hatalar) SQS otomatik olarak yeniden dener
  #    (visibility timeout dolunca)
  #  - maxReceiveCount (3) denemeden sonra hâlâ başarısızsa mesaj
  #    kendiliğinden MusicGenerationDLQ'ya (dead-letter queue) düşer
  #  - melodia-video'daki AssemblyQueue/AssemblyDLQ ile BİREBİR AYNI
  #    desen kullanılıyor
  # ---------------------------------------------------------------
  MusicGenerationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: melodia-music-generation-dlq
      MessageRetentionPeriod: 1209600 # 14 gün

  MusicGenerationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: melodia-music-generation-queue
      VisibilityTimeout: 90 # ProcessMusicGenerationFunction Timeout'undan (60s) biraz fazla
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MusicGenerationDLQ.Arn
        maxReceiveCount: 3

  # YENİ: Kullanıcı bazlı hız sınırlama (rate limiting) için sayaç tablosu.
  # rateLimit.js bu tabloyu "sabit pencereli" bir sayaç olarak kullanıyor —
  # her (kullanıcı, uç nokta, zaman dilimi) için atomik bir sayaç tutuluyor.
  # TTL ile pencere kapanınca otomatik silinir, elle temizlik gerekmez.
  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: melodia-rate-limits
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rateLimitKey
          AttributeType: S
      KeySchema:
        - AttributeName: rateLimitKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  SongsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: melodia-songs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: songId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: songId
          KeyType: RANGE

  # ---------------------------------------------------------------
  # YENİ: Şarkı ses dosyaları için kalıcı, private depolama
  # ---------------------------------------------------------------
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub melodia-audio-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AudioBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AudioBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${AudioBucket.Arn}/songs/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${AudioDistribution}"

  AudioOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: melodia-audio-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AudioPublicKey:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        Name: melodia-audio-key
        EncodedKey: !Ref CloudFrontPublicKeyPem
        CallerReference: melodia-audio-key-v1

  AudioKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Name: melodia-audio-key-group
        Items:
          - !Ref AudioPublicKey

  AudioDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultCacheBehavior:
          TargetOriginId: AudioS3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS Managed-CachingOptimized
          TrustedKeyGroups:
            - !Ref AudioKeyGroup
        Origins:
          - Id: AudioS3Origin
            DomainName: !GetAtt AudioBucket.RegionalDomainName
            OriginAccessControlId: !Ref AudioOAC
            S3OriginConfig:
              OriginAccessIdentity: ""

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: melodia-users-pool
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: melodia-mobile-app
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH

  # DEĞİŞTİ: Artık Suno'yu doğrudan çağırmıyor — sadece jeton kontrolü
  # yapıp bir job kaydı oluşturuyor ve MusicGenerationQueue'ya yazıyor.
  # Bu yüzden Timeout kısaltıldı (ağır iş artık burada değil).
  GenerateSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: generate.handler
      Timeout: 15
      Environment:
        Variables:
          SONG_CREDIT_COST: !Ref SongCreditCost
          JOBS_TABLE_NAME: !Ref GenerationJobsTable
          GENERATION_QUEUE_URL: !Ref MusicGenerationQueue
          RATE_LIMIT_TABLE_NAME: !Ref RateLimitTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GenerationJobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MusicGenerationQueue.QueueName
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /generate
            Method: post

  # YENİ: MusicGenerationQueue'dan tetiklenen worker. Asıl Suno /generate
  # çağrısını burada yapıyoruz. Suno geçici hata verirse (5xx/429/timeout)
  # istisna fırlatılır ve SQS otomatik yeniden dener; kalıcı hatalarda
  # (ör. içerik reddi) job doğrudan "failed" işaretlenir, tekrar denenmez.
  # Jeton SADECE Suno isteği kabul edildiğinde burada düşülüyor.
  ProcessMusicGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: processMusicGeneration.handler
      Timeout: 60
      Environment:
        Variables:
          SONG_CREDIT_COST: !Ref SongCreditCost
          JOBS_TABLE_NAME: !Ref GenerationJobsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GenerationJobsTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/suno-api-key-*'
      Events:
        GenerationQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt MusicGenerationQueue.Arn
            BatchSize: 1

  LyricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: lyrics.handler
      Environment:
        Variables:
          RATE_LIMIT_TABLE_NAME: !Ref RateLimitTable
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/suno-api-key-*'
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /lyrics
            Method: post

  LyricsStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: lyricsStatus.handler
      Environment:
        Variables:
          RATE_LIMIT_TABLE_NAME: !Ref RateLimitTable
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/suno-api-key-*'
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /lyrics-status
            Method: get

  # DEĞİŞTİ: Artık jobId (queued/submitting/failed/ready) VEYA taskId
  # (Suno'nun kendi durumu) ile sorgulanabiliyor. GenerationJobsTable
  # okuma izni ve tablo adı eklendi.
  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: status.handler
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref GenerationJobsTable
          RATE_LIMIT_TABLE_NAME: !Ref RateLimitTable
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/suno-api-key-*'
        - DynamoDBReadPolicy:
            TableName: !Ref GenerationJobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /status
            Method: get

  SunoCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: sunoCallback.handler
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/suno-api-key-*'
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /suno-callback
            Method: post
            Auth:
              Authorizer: NONE

  AppleAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: appleAuth.handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          APPLE_BUNDLE_ID: !Ref AppleBundleId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /auth/apple
            Method: post
            Auth:
              Authorizer: NONE

  GetQuotaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: quota.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /quota
            Method: get

  LyricsTimestampsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: lyricsTimestamps.handler
      Environment:
        Variables:
          RATE_LIMIT_TABLE_NAME: !Ref RateLimitTable
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/suno-api-key-*'
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /lyrics-timestamps
            Method: post

  # DEĞİŞTİ: artık Suno'dan gelen sesi indirip AudioBucket'a kopyalıyor,
  # bu yüzden S3 yazma izni ve daha uzun timeout gerekiyor.
  SaveSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: saveSong.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SongsTable
        - S3CrudPolicy:
            BucketName: !Ref AudioBucket
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /songs
            Method: post

  ListSongsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: listSongs.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SongsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /songs
            Method: get

  # YENİ: şarkı her çalınmak istendiğinde taze CloudFront signed URL üretir
  GetSongPlayUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: getSongPlayUrl.handler
      Timeout: 15
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SongsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref CloudFrontPrivateKeySecretArn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /songs/{songId}/play-url
            Method: get

  # YENİ: kullanıcı kütüphanesinden tek bir şarkıyı siler
  DeleteSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: deleteSong.handler
      Timeout: 15
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SongsTable
        - S3CrudPolicy:
            BucketName: !Ref AudioBucket
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /songs/{songId}
            Method: delete

  DeleteAccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: deleteAccount.handler
      Timeout: 30
      Environment:
        Variables:
          VIDEO_PROJECTS_TABLE_NAME: melodia-video-projects
          VIDEO_BUCKET_NAME: !Sub "melodia-video-${AWS::AccountId}-${AWS::Region}"
          USER_POOL_ID: !Ref UserPool
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SongsTable
        - S3CrudPolicy:
            BucketName: !Ref AudioBucket
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:DeleteItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/melodia-video-projects"
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::melodia-video-${AWS::AccountId}-${AWS::Region}/*"
            - Effect: Allow
              Action:
                - cognito-idp:AdminDeleteUser
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /account
            Method: delete

  # ---------------------------------------------------------------
  # YENİ (Madde 11 — Paywall): satın alma anında istemcinin gönderdiği
  # imzalı Apple makbuzunu doğrulayıp kullanıcının planını günceller.
  # Apple'ın RESMİ kütüphanesi (@apple/app-store-server-library)
  # kullanılıyor — imza doğrulama elle yazılmıyor.
  # ---------------------------------------------------------------
  VerifySubscriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: verifySubscription.handler
      Timeout: 20
      Environment:
        Variables:
          APPLE_BUNDLE_ID: !Ref AppleBundleId
          APPLE_IAP_ISSUER_ID: !Ref AppleIapIssuerId
          APPLE_IAP_KEY_ID: !Ref AppleIapKeyId
          APPLE_IAP_KEY_SECRET_ARN: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/apple-iap-private-key'
          APPLE_IAP_ENVIRONMENT: !Ref AppleIapEnvironment
          APPLE_APP_APPLE_ID: !Ref AppleAppAppleId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/apple-iap-private-key-*'
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /subscription/verify
            Method: post

  # YENİ (Madde 11): Apple'ın App Store Server Notifications V2 webhook'u.
  # Auth: NONE (Apple'ın sunucusu çağırıyor) ama güvenlik JWS imza
  # doğrulamasından geliyor.
  AppleNotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: appleNotifications.handler
      Timeout: 20
      Environment:
        Variables:
          APPLE_BUNDLE_ID: !Ref AppleBundleId
          APPLE_IAP_ISSUER_ID: !Ref AppleIapIssuerId
          APPLE_IAP_KEY_ID: !Ref AppleIapKeyId
          APPLE_IAP_KEY_SECRET_ARN: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/apple-iap-private-key'
          APPLE_IAP_ENVIRONMENT: !Ref AppleIapEnvironment
          APPLE_APP_APPLE_ID: !Ref AppleAppAppleId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/apple-iap-private-key-*'
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /apple-notifications
            Method: post
            Auth:
              Authorizer: NONE

  # GEÇİCİ — SADECE TEST: webhook kurulumunu doğruladıktan sonra bu
  # fonksiyonu ve requestTestNotification.js dosyasını silebilirsin.
  RequestTestNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: requestTestNotification.handler
      Timeout: 20
      Environment:
        Variables:
          APPLE_BUNDLE_ID: !Ref AppleBundleId
          APPLE_IAP_ISSUER_ID: !Ref AppleIapIssuerId
          APPLE_IAP_KEY_ID: !Ref AppleIapKeyId
          APPLE_IAP_KEY_SECRET_ARN: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/apple-iap-private-key'
          APPLE_IAP_ENVIRONMENT: !Ref AppleIapEnvironment
          APPLE_APP_APPLE_ID: !Ref AppleAppAppleId
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:melodia/apple-iap-private-key-*'
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref MelodiaApi
            Path: /test-apple-notification
            Method: get
            Auth:
              Authorizer: NONE

  # YENİ: API Gateway'in kendi, kaba/genel taşkın koruması. Kullanıcı bazlı
  # DEĞİL — tüm API için toplam saniyelik istek tavanı. rateLimit.js'teki
  # kullanıcı bazlı limitler "tek bir kullanıcı sistemi kötüye kullanamasın"
  # içinken, bu ayar "API'nin tamamı aniden binlerce istekle boğulmasın"
  # (ör. bir DDoS denemesi) için ilk savunma hattı. İkisi birlikte çalışıyor.
  MelodiaApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 20 # saniyede sürekli izin verilen ortalama istek sayısı (tüm API, tüm kullanıcılar toplamı)
          ThrottlingBurstLimit: 40 # anlık patlamalarda (ör. birkaç kullanıcı aynı anda) tolerans
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuth
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn

Outputs:
  ApiUrl:
    Value: !Sub "https://${MelodiaApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  AudioBucketName:
    Value: !Ref AudioBucket
  AudioCloudFrontDomain:
    Value: !GetAtt AudioDistribution.DomainName
  UsersTableName:
    Description: >
      melodia-video ve melodia-music-spec stack'lerinin ayni jeton/kota
      havuzunu kontrol edebilmesi icin disari acilan tablo adi.
    Value: !Ref UsersTable
    Export:
      Name: melodia-users-table-name
  UsersTableArn:
    Value: !GetAtt UsersTable.Arn
    Export:
      Name: melodia-users-table-arn
  MusicGenerationDLQUrl:
    Description: >
      Kalici olarak basarisiz olan (3 denemeden sonra) muzik uretim
      isleri buraya duser. Boyutu 0'dan buyukse manuel inceleme gerekir.
    Value: !Ref MusicGenerationDLQ
  AppleNotificationsUrl:
    Description: >
      App Store Connect > App Information > App Store Server Notifications
      kismindaki "Sandbox Server URL" ve/veya "Production Server URL"
      alanina AYNEN bu degeri yapistir.
    Value: !Sub "https://${MelodiaApi}.execute-api.${AWS::Region}.amazonaws.com/prod/apple-notifications"